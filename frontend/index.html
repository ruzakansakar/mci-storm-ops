<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ground-Stop Co-Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/live.css">
<script>
  try { const s = localStorage.getItem('gsc-theme'); if (s) document.documentElement.dataset.theme = s; } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 18.5l16-6-4 9-3.5-2.5-2.5 3-1-4.5z" fill="currentColor"/></svg>
    <div>
      <div class="brand-name">Ground-Stop Co-Pilot</div>
      <div class="brand-sub">Kansas City (MCI) station view</div>
    </div>
  </div>
  <nav class="pages" aria-label="Pages">
    <a href="/" aria-current="page">Network map</a>
    <a href="/live.html">Live control room</a>
  </nav>
  <div class="topbar-right">
    <label class="field">
      <span class="field-label">Simulated day</span>
      <select id="run"></select>
    </label>
    <button id="theme" class="btn ghost" type="button" aria-label="Switch between light and dark mode">Dark mode</button>
  </div>
</header>

<section class="playbar" aria-label="Replay controls">
  <button id="play" class="btn primary play" type="button" aria-label="Play">
    <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
  </button>
  <div class="clock"><span id="clock">08:00</span><span class="clock-sub" id="date">Tue Oct 6</span></div>
  <label class="slider">
    <span class="sr-only">Time of day</span>
    <input id="time" type="range" min="300" max="1439" step="1" value="480">
    <span class="ticks" aria-hidden="true"><span>05:00</span><span>09:00</span><span>13:00</span><span>17:00</span><span>21:00</span></span>
  </label>
  <div class="speed" role="group" aria-label="Replay speed">
    <button class="btn chip" data-speed="1" type="button">1 min/s</button>
    <button class="btn chip active" data-speed="5" type="button">5 min/s</button>
    <button class="btn chip" data-speed="15" type="button">15 min/s</button>
  </div>
</section>

<section id="alert" class="alert" aria-live="polite" hidden></section>

<main class="layout">
  <section class="card map-card" aria-label="Network map">
    <div class="map-top">
      <div class="map-status" id="status-chips"></div>
      <div class="agent-strip" id="agent-strip" aria-label="Co-pilot agents"></div>
    </div>
    <canvas id="map" aria-label="Map of today's flights to and from Kansas City" role="img"></canvas>
    <div id="tooltip" class="tooltip" hidden></div>
    <div id="tracker" class="tracker" aria-live="polite" hidden></div>
    <div class="map-legend">
      <span><i class="lg lg-out"></i>Leaving MCI</span>
      <span><i class="lg lg-in"></i>Coming to MCI</span>
      <span><i class="lg lg-warn"></i>Holding or diverted</span>
      <span class="hint">Click a plane or a flight to follow it. Drag to turn, scroll to zoom</span>
    </div>
  </section>

  <aside class="side">
    <section class="card wx-card" id="wx-card" aria-label="Weather at MCI">
      <div class="card-head">
        <h2>Weather at MCI</h2>
        <span class="tag" title="The simulator has no weather readings. This picture follows the day's events only, and no agent uses it.">Simulated</span>
      </div>
      <div class="wx-body">
        <svg id="wx-dial" class="wx-dial" viewBox="0 0 100 100" role="img" aria-label="Wind direction">
          <circle cx="50" cy="50" r="44" class="dial-ring"/>
          <g class="dial-ticks">
            <path d="M50 8v8M50 84v8M8 50h8M84 50h8"/>
          </g>
          <text x="50" y="27" class="dial-n">N</text>
          <text x="76" y="54" class="dial-l">E</text>
          <text x="50" y="81" class="dial-l">S</text>
          <text x="24" y="54" class="dial-l">W</text>
          <g id="wx-arrow"><path class="dial-arrow" d="M50 18l9 22h-6v32h-6V40h-6z"/></g>
          <circle cx="50" cy="50" r="4" class="dial-hub"/>
        </svg>
        <div class="wx-text">
          <p class="wx-cond" id="wx-cond">Clear</p>
          <p class="wx-trend" id="wx-trend"></p>
          <dl class="wx-facts" id="wx-facts"></dl>
        </div>
      </div>
    </section>
    <section class="card" aria-label="MCI right now">
      <h2>MCI right now</h2>
      <div class="stats" id="stats"></div>
    </section>
    <section class="card board-card" aria-label="Flight board">
      <div class="board-head">
        <h2>Flight board</h2>
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" aria-selected="true" data-board="dep" type="button">Departures</button>
          <button class="tab" role="tab" aria-selected="false" data-board="arr" type="button">Arrivals</button>
        </div>
      </div>
      <div class="board-wrap"><table class="board" id="board"></table></div>
    </section>
  </aside>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
