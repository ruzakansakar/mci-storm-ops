# The decision catalog. Generated by `python -m scripts.build_decisions`.
version: 1
about: Every decision the co-pilot may raise during a ground stop. proposed_by = the agent that raises it; decided_by = who decides (from config/rules/autonomy.yaml,
  with rungs 1-4 never automatic); checked_by = the orchestrator's rule check plus the rules it runs. Built by scripts/build_decisions.py; edit
  the table there and rerun.
decisions:
- id: A01
  family: detect_and_classify
  question: Is this a real disruption or normal variation?
  trigger: Several flights delayed or a stop announced (ground_stop_started)
  deadline: within 5 min of the first signal
  proposed_by: situation
  action: assess_situation
  decided_by:
    level: auto
  checked_by:
  - orchestrator rule check
  - missing_or_stale_data_blocks
  - action_assess_situation
  safety_rung: none
  rules:
  - missing_or_stale_data_blocks
  - action_assess_situation
  data_needed: &id001
  - events
  - incidents
  - flights.status
  - flights.est_dep
  - stations.ramp_open
  - system_health
  affects: &id002
  - passengers
  - crew
  - airport
  in_story: true
  simulator_event: ground_stop_started
  status: defined
- id: A02
  family: detect_and_classify
  question: 'What type is it: weather, FAA program, IT outage, airport, security, crew, other?'
  trigger: An incident is opened
  deadline: within 10 min of opening the incident
  proposed_by: situation
  action: classify_cause
  decided_by:
    level: needs_approval
    role: network_operations_control
  checked_by:
  - orchestrator rule check
  - uncontrollable_causes
  - controllable_causes
  - action_classify_cause
  safety_rung: none
  rules:
  - uncontrollable_causes
  - controllable_causes
  - action_classify_cause
  data_needed: *id001
  affects: *id002
  in_story: true
  simulator_event: ground_stop_started
  status: defined
- id: A03
  family: detect_and_classify
  question: Is it within Southwest's control (controllable)?
