# Ground-Stop Co-Pilot rules
#
# Every number the co-pilot uses to judge an option lives here, not in code.
# Change a number here, rerun `pytest`, and every agent follows the new rule.
# The simulator reads the legal and safety numbers from this file too (as plain YAML), so each one lives in one place only.
#
# Every rule says where it comes from:
#   source: law         = federal regulation (the regulation is named)
#   source: southwest   = a Southwest policy or commitment (what it is based on is named)
#   source: assumption  = our class-project choice (change freely)

version: 1

# ------------------------------------------------------------------ SAFETY LADDER
# Checked top to bottom. An option that fails a "filter" rung is removed, never traded off.
# Rungs 6-8 don't remove anything; they only decide the order of the options that survive.
safety_ladder:
  # source: law 14 CFR 259.4 (tarmac delay + food and water); lightning ramp closure is airline safety practice (assumption)
  - {rung: 1, name: life,           kind: filter, checks: [tarmac_limit, tarmac_food_water, ramp_closed_for_lightning]}
  # source: law 14 CFR 121.639 (fuel); maintenance and inspection checks are assumption
  - {rung: 2, name: aircraft,       kind: filter, checks: [maintenance_due, needs_inspection, fuel_reserve]}
  # source: assumption (a gate must exist; customs for international flights)
  - {rung: 3, name: infrastructure, kind: filter, checks: [station_has_gate, customs_for_international]}
  # source: law 14 CFR part 117 (crew duty and rest); Southwest unaccompanied minor policy (child checks)
  - {rung: 4, name: legal,          kind: filter, checks: [crew_duty_left, crew_rest, child_alone_international, child_alone_no_connection, child_alone_age]}
  # source: law 14 CFR part 382 (wheelchair help, Air Carrier Access Act); child plan is assumption
  - {rung: 5, name: vulnerable,     kind: filter, checks: [wheelchair_help_available, child_alone_has_plan]}
  - {rung: 6, name: network,        kind: rank,   score: network_score}       # source: assumption; higher is better
  - {rung: 7, name: convenience,    kind: rank,   score: pax_disrupted}       # source: assumption; lower is better
  - {rung: 8, name: cost,           kind: rank,   score: cost_usd}            # source: assumption; lower is better

# ------------------------------------------------------------------ LIMITS
limits:
  tarmac_domestic_min: 180            # source: law, 14 CFR 259.4: deplane by 3 h on domestic flights
  tarmac_international_min: 240       # source: law, 14 CFR 259.4: 4 h on international flights
  tarmac_food_water_min: 120          # source: law, 14 CFR 259.4: food and water by 2 h
  pilot_min_rest_hours: 10            # source: law, 14 CFR 117.25
  crew_duty_buffer_min: 30            # source: assumption: never plan a crew to the last minute
  # fuel_minutes_extra = spare HOLDING fuel above the legal reserve. The legal reserve (fuel to reach the
  # alternate airport plus 45 min, 14 CFR 121.639) is already on board and is NOT part of fuel_minutes_extra.
  # A plan is unsafe if: fuel_minutes_extra - hold_minutes - minutes_to_alternate < fuel_buffer_min
  fuel_buffer_min: 10                 # source: assumption: minimum spare holding fuel left after the plan
  min_connection_min: 45              # source: assumption: shortest connection we plan for at MCI

# ------------------------------------------------------------------ CHILDREN FLYING ALONE
# Southwest "Unaccompanied Minor" service. Source for the whole section: southwest, its unaccompanied minor policy
# (support.southwest.com, "Unaccompanied Minors flying alone"). Southwest's page confirms ages 5-11; the nonstop/same-plane
# and no-international parts come from the project brief and secondary sources, so confirm them before relying on them.
child_alone:
  min_age: 5                          # source: southwest: children 5-11 fly as unaccompanied minors
  max_age: 11                         # source: southwest
  nonstop_or_same_plane_only: true    # source: southwest: no change of plane (nonstop or direct on the same plane)
  international_allowed: false        # source: southwest: never to or from international destinations

# ------------------------------------------------------------------ WHO DECIDES WHAT
# auto           the co-pilot does it and writes it to the audit log
# needs_approval the co-pilot proposes; the named role taps approve or reject
# human_only     the co-pilot may show facts, never a recommendation it can act on
# Anything not listed here is treated as human_only.
autonomy:
  send_status_update:      {level: auto}                                                              # source: assumption
  fix_channel_mismatch:    {level: auto}                                                              # source: assumption
  hold_hotel_rooms:        {level: auto, max_rooms: 40}                                               # source: assumption
  request_wheelchair_help: {level: auto}                                                              # source: assumption
  rebook_passenger:        {level: needs_approval, approver: customer_service_supervisor}             # source: assumption
  issue_compensation:      {level: needs_approval, approver: customer_service_supervisor}             # source: assumption
  call_in_reserve_crew:    {level: needs_approval, approver: crew_scheduling}                         # source: assumption
  swap_aircraft:           {level: needs_approval, approver: network_operations_control}              # source: assumption
  delay_flight:            {level: needs_approval, approver: network_operations_control}              # source: assumption
  cancel_flight:           {level: needs_approval, approver: network_operations_control}              # source: assumption
  divert_flight:           {level: human_only, approver: dispatcher_and_captain}                      # source: law, 14 CFR 121.533 (dispatcher and captain share responsibility)
  ramp_closure:            {level: human_only, approver: ramp_supervisor}                             # source: assumption
  release_aircraft_after_inspection: {level: human_only, approver: maintenance_control}               # source: assumption (maintenance sign-off, 14 CFR part 121)
  extend_crew_duty:        {level: human_only, approver: captain}                                     # source: law, 14 CFR part 117 (duty limit extensions are the captain's call)

# Anything that would change a safety fact (rungs 1-4) is never automatic, whatever is written above.
never_auto_rungs: [1, 2, 3, 4]        # source: assumption

# ------------------------------------------------------------------ COMPENSATION
# Legal floor: owed to everyone, whatever the cause.
# Southwest commitments: owed only when the cause was within Southwest's control.
# Goodwill: optional, always needs a supervisor's approval.
compensation:
  significant_delay_domestic_min: 180       # source: law, DOT refund rule 14 CFR part 260 (89 FR 32760, Apr 2024): arrival 3+ h late
  significant_delay_international_min: 360  # source: law, same rule: 6+ h for international
  controllable_delay_min: 180               # source: southwest: commitments start at a 3+ h controllable delay (Southwest customer service plan)
  voucher_usd: 75                           # source: southwest: DOT settlement (Dec 2023), at least $75
  meal_usd: 15                              # source: assumption: value of one meal voucher
  hotel_needed_if_overnight: true           # source: southwest: hotel + ground transport for controllable overnights
  goodwill_usd: 50                          # source: assumption: optional credit for uncontrollable cases
  uncontrollable_causes: [weather, faa_program, ground_stop, security, airport]   # source: southwest/assumption: weather, ATC and security are outside the airline's control
  controllable_causes:   [maintenance, crew, it_outage, staffing, operational]    # source: southwest/assumption: the airline's own systems, crews and planes
  # Delayed checked bags. Law: DOT refund rule, 14 CFR 260.5 (89 FR 32760, Apr 2024): the checked-bag fee is refunded if a
  # bag is not delivered within 12 h of a domestic flight's arrival, or within 15 h (30 h on very long flights) of an
  # international flight's arrival. The passenger must have filed a mishandled baggage report.
  bag_refund_hours_domestic: 12             # source: law, 14 CFR 260.5
  bag_refund_hours_international: 15        # source: law, 14 CFR 260.5 (flights of 12 h or less)
  bag_refund_hours_international_long: 30   # source: law, 14 CFR 260.5 (longer flights)
  long_flight_hours: 12                     # source: law, 14 CFR 260.5: the cut-off we use between "15 h" and "30 h" flights (the exact cut-off was not confirmed)
  # Southwest started charging for checked bags on 28 May 2025 ($35 first, $45 second). On 9 Apr 2026 it raised them to
  # $45 first and $55 second (A-List and credit-card holders keep a free first bag, A-List Preferred two).
  # Sources: airlinegeeks.com/2026/04/08/southwest-becomes-latest-u-s-airline-to-raise-checked-bag-fees and
  # fortune.com/2026/04/08/southwest-hiking-baggage-fees-again-fuel-costs-iran-war-delta-jetblue-united-bags-fly-free-policy
  bag_fee_usd: 45                           # source: assumption: first checked bag fee, from the news sources above (not from southwest.com)
