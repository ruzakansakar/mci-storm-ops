# CONTRACT: guardrail. Checks every proposal against the safety ladder before a human sees it.
agent: guardrail
purpose: "Checks every proposal against the safety ladder and the rules, and blocks any that break them."

reads:
  recommendations: [id, incident_id, agent, title, why, options, autonomy, approver_role, deadline, rank, safety_rung, guardrail_ok, guardrail_notes, data_as_of, status, run_id, created_at]
  flights: [id, direction, origin, destination, sched_dep, sched_arr, est_dep, est_arr, aircraft_id, crew_id, reserve_crew_ids, status, tarmac_since, pax_total, as_of]
  aircraft: [id, current_station, airborne, fuel_minutes_extra, maint_status, maint_due_at, needs_inspection, as_of]
  crews: [id, kind, base, current_station, is_reserve, reserve_status, available_from, pilot_duty_left_min, fa_duty_left_min, min_rest_hours, restrictions, fatigue_reported, as_of]
  stations: [code, gates, wheelchair_staff, has_customs, ramp_open, as_of]
  staff: [id, role, station, shift_start, shift_end, last_break, on_duty, as_of]
  passenger_groups: [flight_id, segment, count, as_of]
  incidents: [id, kind, status, run_id]
  events: [id, occurred_at, type, station, payload, run_id]

writes:
  recommendations: {mode: update, columns: [guardrail_ok, guardrail_notes, status], status_values: [blocked_by_guardrail]}
  events: {mode: insert, types: [guardrail_passed, guardrail_blocked, contract_check_failed]}
  audit_log: {mode: insert}

actions: []                              # it proposes nothing; it only approves or blocks what others propose

never:
  - Never let a proposal through that fails a rung 1 to 4 check; those are never traded off.
  - Never accept a proposal whose data is older than its allowed age.
  - Never rank or change a proposal. It passes it or blocks it, and says why in plain words.
  - Never decide a diversion, a ramp closure or a keep-on-board exception.
  - Never edit any truth table.
  - Never see passenger names or contact details.

stores:
  temporary:
    what: "The checks it ran on the proposal in front of it."
    kept_until: "the incident is closed, then deleted"
  permanent:
    - {table: recommendations, kept: "for the life of the project, only the guardrail columns and the blocked status change"}
    - {table: events, kept: "for the life of the project, append only"}
    - {table: audit_log, kept: "for the life of the project, never edited or deleted"}

output:
  type: object
  additionalProperties: false
  required: [title, why, data_as_of, options, recommendation_id, guardrail_ok, notes, rung_failed]
  properties:
    title: {type: string, minLength: 1}
    why: {type: string, minLength: 1}
    data_as_of: {type: string}
    options: {type: array, items: {type: object}}
    recommendation_id: {type: integer}
    guardrail_ok: {type: boolean}
    notes: {type: array, items: {type: string}}
    rung_failed: {type: [integer, "null"], minimum: 1, maximum: 8}

max_data_age_sec: 60
time_budget_sec: 10
escalate_when:
  - A proposal cannot be checked because a needed fact is missing (unknown counts as unsafe).
  - A proposal touches a human-only decision.
  - The same agent has two proposals blocked in a row.

ai_allowed: {allowed: false, for: [], fallback: "not needed, it uses no language model"}

success:
  - {metric: "unsafe proposals that reach a human", target: "0"}
  - {metric: "seconds to check a proposal", target: "10 or fewer"}
