# CONTRACT: orchestrator. Plain code, no AI. Routes work, runs the rule check on every proposal, catches conflicts, escalates to humans.
agent: orchestrator
phase: 5a
purpose: Plain code, no AI. Opens and runs the incident, routes work to the five agents, runs the rule check (backend/rules/check.py) on every
  proposal before any human sees it, catches conflicts between agents, and escalates to humans.
reads:
  incidents:
  - id
  - kind
  - station
  - title
  - likely_cause
  - confidence
  - controllable
  - status
  - expected_end_min
  - expected_end_max
  - opened_at
  - resolved_at
  - opened_by
  - run_id
  - updated_at
  incident_events:
  - incident_id
  - event_id
  events:
  - id
  - occurred_at
  - type
  - actor
  - actor_name
  - station
  - payload
  - run_id
  recommendations:
  - id
  - incident_id
  - agent
  - title
  - why
  - options
  - autonomy
  - approver_role
  - deadline
  - rank
  - safety_rung
  - decision_ids
  - rule_check_ok
  - rule_check_notes
  - rule_ids
  - data_as_of
  - status
  - run_id
  - created_at
  - updated_at
  flights:
  - id
  - direction
  - origin
  - destination
  - sched_dep
  - sched_arr
  - est_dep
  - est_arr
  - edct
  - aircraft_id
  - crew_id
  - reserve_crew_ids
  - status
  - priority
  - pax_total
  - tarmac_since
  - diverted_to
  - cancel_reason
  - controllable
  - as_of
  stations:
  - code
  - name
  - gates
  - wheelchair_staff
  - has_customs
  - terminal_capacity
  - people_in_terminal
  - ramp_open
  - as_of
  system_health:
  - system
  - status
  - last_heartbeat
  - data_age_sec
  - note
  aircraft:
  - id
  - type
  - seats
  - current_station
  - airborne
  - fuel_minutes_extra
  - maint_status
  - maint_due_at
  - needs_inspection
  - as_of
  crews:
  - id
  - kind
  - base
  - current_station
  - is_reserve
  - reserve_status
  - available_from
  - pilot_duty_left_min
  - fa_duty_left_min
  - min_rest_hours
  - restrictions
  - fatigue_reported
  - availability
  - as_of
  staff:
  - id
  - role
  - station
  - shift_start
  - shift_end
  - last_break
  - on_duty
  - as_of
  passenger_groups:
  - flight_id
  - segment
  - count
  - rebooked
  - as_of
  decisions:
  - id
  - recommendation_id
  - decided_by
  - role
  - verdict
  - chosen_option
  - reason
  - decided_at
# Phase 5a: it reads Situation's picture (to open, rank and close incidents) through AgentContext, like any reader.
shared_reads:
  situation_assessments:
    producer: situation
    fields: [version, assessed_at, status, type, confidence, expected_end_likely, expected_end_latest, end_confidence, impact]
    heartbeat: true                    # impact: other_suspected_causes = a possible second incident (A04)
writes:
  orchestrator_log:                    # Phase 5a: one row a minute (append-only): who ran, versions read and written, the queue
    mode: insert
    columns: [at, row]
  incidents:
    mode: insert_or_update
    columns:
    - kind
    - station
    - title
    - likely_cause
    - confidence
    - controllable
    - status
    - expected_end_min
    - expected_end_max
    - opened_at
    - resolved_at
    - opened_by
    - run_id
  incident_events:
    mode: insert
    columns:
    - incident_id
    - event_id
  recommendations:
    mode: insert_or_update
    columns:
    - incident_id
    - agent
    - title
    - why
    - options
    - autonomy
    - approver_role
    - deadline
    - rank
    - safety_rung
    - decision_ids
    - data_as_of
    - status
    - run_id
    - created_at
    - rule_check_ok
    - rule_check_notes
    - rule_ids
    status_values:
    - pending
    - blocked_by_rule_check
  events:
    mode: insert
    types:
    - incident_opened
    - incident_updated
    - incident_closed
    - work_assigned
    - agent_timed_out
    - escalated_to_human
    - human_decision_needed
    - rule_check_passed
    - rule_check_blocked
    - conflict_found
    - agents_disagree
    - incident_ranked
    - incident_recovery_proposed
    - decision_escalated
    - queue_batched
    - queue_merged
    - workload_high
    - stale_chain_found
    - decision_applied
    - decision_refused
  audit_log:
    mode: insert
actions:
- close_incident
- declare_recovery
- escalate_cost
- escalate_to_next_role
- file_dot_tarmac_report
- flag_stale_data
- keep_records
- open_incident
- rank_for_humans
- resolve_source_conflict
- set_incident_priority
- track_cost
- write_after_action_report
# 5a builds these; the others are defined here but not built yet (enabled_in: later).
capabilities:
- {action: open_incident, enabled_in: 5a, note: "A04: new incident or part of an open one (automatic)"}
- {action: set_incident_priority, enabled_in: 5a, note: "T05: two incidents, safety first (station manager)"}
- {action: declare_recovery, enabled_in: 5a, note: "A10 (network operations control)"}
- {action: close_incident, enabled_in: 5a, note: "Q07: temporary notes deleted, audit log kept (station manager)"}
- {action: escalate_to_next_role, enabled_in: 5a, note: "S06: nobody answered in time (automatic)"}
- {action: rank_for_humans, enabled_in: 5a, note: "one queue: safety rung, deadline, passengers"}
- {action: flag_stale_data, enabled_in: 5a, note: "S02: the shared-state audit flags a stale chain"}
- {action: escalate_cost, enabled_in: later}
- {action: file_dot_tarmac_report, enabled_in: later}
- {action: keep_records, enabled_in: later}
- {action: resolve_source_conflict, enabled_in: later}
- {action: track_cost, enabled_in: later}
- {action: write_after_action_report, enabled_in: later}
never:
- Never let a human see a proposal before the rule check (backend/rules/check.py) has run on it.
- Never pass a proposal the rule check blocked, and never override a block. Only a named human can, where a law rule allows it.
- Never change a flight, booking, crew, aircraft, bag, hotel or any other truth table.
- 'Never decide anything human only: a diversion, a ramp closure, a keep-on-board exception, a duty extension, a fatigue removal.'
- Never hide or drop a proposal or a block. Show all of them, with the reasons.
- Never close an incident while a proposal has not been through the rule check.
- Never use a language model. It is plain code.
- Never see passenger names or contact details. It works with passenger ids only.
stores:
  temporary:
    what: Working notes about which agent has been asked what, and the merged picture it is building.
    kept_until: the incident is closed, then deleted
  permanent:
  - table: incidents
    kept: for the life of the project
  - table: incident_events
    kept: for the life of the project
  - table: recommendations
    kept: for the life of the project
  - table: audit_log
    kept: for the life of the project, never edited or deleted
output:
  type: object
  additionalProperties: false
  required:
  - title
  - why
  - data_as_of
  - options
  - sources
  - decision_ids
  - incident_status
  - assigned_agents
  - open_questions
  properties:
    title:
      type: string
      minLength: 1
    why:
      type: string
      minLength: 1
    data_as_of:
      type: string
    options:
      type: array
      items:
        type: object
    incident_status:
      type: string
      enum:
      - suspected
      - open
      - monitoring
      - resolved
    assigned_agents:
      type: array
      items:
        type: string
        enum:
        - situation
        - network_recovery
        - station_staff
        - passenger_care
        - communication
    open_questions:
      type: array
      items:
        type: string
    decision_ids:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 3
    sources:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - source
        - as_of
        properties:
          fact:
            type: string
          source:
            type: string
            minLength: 1
          as_of:
            type: string
            minLength: 10
max_data_age_sec: 120
time_budget_sec: 15
escalate_when:
- The rule check blocks a proposal (it goes to the named human with the reason).
- Two agents propose things that can't both happen.
- The incident cause is unknown after the situation agent reports.
- Any decision that is human only.
- 'A named human doesn''t answer before the deadline (human_answer_deadline_min): go to the next role.'
ai_allowed:
  allowed: false
  for: []
  fallback: not needed, it uses no language model
success:
- metric: minutes from the first sign of trouble to an open incident
  target: 5 or fewer
- metric: proposals shown to a human without a rule check
  target: '0'
- metric: conflicting proposals that reach a human unflagged
  target: '0'
runs_rule_check_on_every_proposal: true
