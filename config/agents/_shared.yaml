# SHARED AI GUARDRAILS: rules every agent follows (orchestrator + the five agents).
# This file is not a contract; the contract loader skips files whose name starts with "_".
# enforced_in: where the rule is enforced in code.  checked_by: the exact function (module:name), tested in tests/test_shared_guardrails.py.
guardrails:
  - id: G01_source_and_time
    rule: Never state a fact without its source and its as_of time.
    enforced_in: AgentContext
    checked_by: backend.contracts.context:AgentContext.propose
    how: Every output must list sources, each with a source name and an ISO as_of time; anything else is refused.

  - id: G02_no_stale_data
    rule: Never act on data older than the contract's max_data_age_sec.
    enforced_in: AgentContext and orchestrator rule check
    checked_by: backend.contracts.context:AgentContext.check_fresh
    how: AgentContext refuses to save a proposal built on old data; the rule check also blocks one whose data_as_of is too old.

  - id: G03_no_human_only_decisions
    rule: Never decide anything marked human_only, and never make a safety exception.
    enforced_in: AgentContext and orchestrator rule check
    checked_by: backend.rules.check:check
    how: >-
      A contract can't list a human-only action, AgentContext refuses one at run time (the agent can only ask_human with the facts),
      and the rule check blocks any proposal for a human-only action or one that relies on a tarmac safety exception.

  - id: G04_no_unapproved_promises
    rule: Never promise compensation, a rebooking or a time that a human hasn't approved.
    enforced_in: orchestrator rule check
    checked_by: backend.rules.check:check
    how: A message or offer that promises something must name the approved decision that backs it, or it is blocked.

  - id: G05_personal_data
    rule: Only see passenger personal data if the contract allows it, and only for the passengers the agent is working on.
    enforced_in: AgentContext
    checked_by: backend.contracts.context:AgentContext.read
    how: Names and contacts are refused to the other agents; passenger_care and communication must first say which passengers they are working on (working_on), and may only read those.

  - id: G06_schema
    rule: Every output matches its schema; anything else is rejected.
    enforced_in: AgentContext
    checked_by: backend.contracts.jsonschema_lite:validate
    how: AgentContext.propose checks the output against the contract's JSON schema before saving it.

  - id: G07_hand_to_a_named_human
    rule: When unsure, or when two rules conflict, hand it to the named human with the reason.
    enforced_in: orchestrator rule check
    checked_by: backend.rules.check:check
    how: Every block names the human role it goes to and why; an agent that is unsure uses AgentContext.ask_human with the decision id.

  - id: G08_decision_ids
    rule: Every recommendation names the decision id(s) from config/decisions.yaml that it answers.
    enforced_in: AgentContext
    checked_by: backend.contracts.context:AgentContext.propose
    how: Unknown decision ids, or decisions another agent is responsible for, are refused.

  - id: G09_rule_check_first
    rule: Every proposal goes through the orchestrator's rule check before any human sees it; an agent's own check never counts as final.
    enforced_in: orchestrator rule check
    checked_by: backend.contracts.review:shown_to_humans
    how: Proposals are saved unchecked (rule_check_ok is empty, whatever the agent says about its own checks); humans only see those the rule check passed.

  - id: G10_ai_text_checked
    rule: If a language model is used, its text is checked against the facts before anyone sees it; if the check fails, the template is used.
    enforced_in: AgentContext
    checked_by: backend.contracts.context:AgentContext.ai_text
    how: Every flight number, time and amount in the model's text must appear in the facts; only situation and communication may use a model at all.

  - id: G11_audit_everything
    rule: Everything is written to the audit log.
    enforced_in: AgentContext
    checked_by: backend.contracts.context:AgentContext.write
    how: Every write an agent makes (proposals, events, rule-check results) also writes an audit_log row, and so does every contract violation and override.

# SHARED STATE (Phase 4c): how agents share information. Written once; every agent follows them. Enforced in code, not in agents.
# checked_by: the exact function (module:name), tested in tests/test_shared_state.py.
shared_state:
  - id: SS1_no_direct_calls
    rule: Agents never call each other. They share information only through shared tables and events.
    checked_by: backend.contracts.buffered:SharedStore
    how: >-
      An agent's only door is its AgentContext. In the minute loop each agent gets its own context; they meet only in the shared
      store (the database outside the loop). No agent module imports another agent's code (tested).
  - id: SS2_append_only_versioned
    rule: Every shared record is append-only and versioned, and carries its producer agent, its time and its sources.
    checked_by: backend.contracts.shared_state:SHARED
    how: >-
      SHARED names each shared table's producer, version, time and source columns. The database refuses UPDATE/DELETE on
      situation_assessments (trigger), and only its producer may insert (OWN_TABLES).
  - id: SS3_no_future
    rule: A reader only sees records with time <= its current time T.
    checked_by: backend.contracts.shared_state:visible
    how: AgentContext.read_shared returns the latest version whose time is <= now, even within the same minute.
  - id: SS4_contract_fields_only
    rule: A reader's contract lists exactly which producer fields it may read. Everything else is refused.
    checked_by: backend.contracts.shared_state:validate_shared_reads
    how: >-
      shared_reads in the reader's contract lists the fields; the loader refuses unknown fields and fields that are never shared
      (NEVER_SHARED: flight_controllability, evidence); AgentContext.read_shared refuses any other field at run time.
  - id: SS5_suspicion_is_not_fact
    rule: A reader never treats another agent's suspicion as fact. Suspected causes and estimates stay suspected, with their confidence.
    checked_by: backend.contracts.shared_state:project
    how: Suspected cause, type and expected ends reach the reader only under "suspected", each with its confidence; facts are separate.
  - id: SS6_producer_freshness
    rule: >-
      Freshness is about the producer, not the record. An old version is not stale (it is only rewritten when something changes);
      a producer that stopped running is.
    checked_by: backend.contracts.context:AgentContext.producer_heartbeat
    how: >-
      The producer writes an agent_heartbeat event every run (AgentContext.heartbeat). Readers measure staleness from the latest
      heartbeat <= now, with their own setting (Communication: situation.unavailable_after_min).
  - id: SS7_disagreements_logged
    rule: When two agents disagree, both views are logged and a human is asked. Resolving it is the orchestrator's job (later).
    checked_by: backend.contracts.shared_state:disagreement
    how: An agents_disagree event holds both views unchanged; the reader escalates through its own escalation action.
