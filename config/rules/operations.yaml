# OUR OWN ASSUMPTIONS AND AIRPORT / STATION FACTS. Change freely, then rerun `pytest`.
# Same entry layout as law.yaml. Everything here is source: assumption unless it says otherwise.
rules:

  # ------------------------------------------------------------------ BUFFERS
  - id: crew_duty_buffer_min
    path: limits.crew_duty_buffer_min
    description: Never plan a crew right to the last minute of its duty.
    value: 30
    source: assumption
    citation: "Class-project choice"
    enforced: true
    checked_by: crew_duty_left

  - id: fuel_buffer_min
    path: limits.fuel_buffer_min
    description: >-
      Spare holding fuel (above the legal reserve) that must still be left after a plan. A plan is unsafe if
      fuel_minutes_extra - hold_minutes - minutes_to_alternate is below this.
    value: 10
    source: assumption
    citation: "Class-project choice; the legal reserve itself is 14 CFR 121.639"
    enforced: true
    checked_by: fuel_reserve

  - id: min_connection_min
    path: limits.min_connection_min
    description: Shortest connection we plan for at MCI.
    value: 45
    source: assumption
    citation: "Class-project choice. Used by the simulator and the seed data, not by a safety check."
    enforced: false

  - id: tarmac_start_return_before_limit_min
    path: tarmac.start_return_before_limit_min
    description: >-
      Start returning to a gate or stairs this many minutes before the legal tarmac limit, so the plane is not still moving
      when the limit hits.
    value: 30
    source: assumption
    citation: "Class-project choice; the law only says the return must have begun before the limit (14 CFR 259.4(c)(3)(i))"
    enforced: true
    checked_by: tarmac_timeline

  # ------------------------------------------------------------------ LIGHTNING AND THE RAMP
  - id: lightning_ramp_radius_miles
    path: lightning.ramp_closed_within_miles
    description: >-
      When lightning is within this distance, the ramp is closed: no fueling, loading, pushback, towing or marshalling
      (ramp workers stay inside).
    value: 5
    source: assumption
    citation: "Airports and airlines pick their own distance (commonly 5 to 10 miles); no federal rule. Class-project choice."
    enforced: true
    checked_by: ramp_closed_for_lightning

  - id: lightning_ramp_blocked_activities
    path: lightning.blocked_activities
    description: The ramp jobs that stop while the ramp is closed.
    value: [fueling, loading, pushback, towing, marshalling]
    source: assumption
    citation: "Common airline ramp practice; class-project choice"
    enforced: true
    checked_by: ramp_closed_for_lightning

  - id: lightning_strike_inspection
    path: lightning.strike_needs_inspection
    description: A plane struck by lightning is inspected, and maintenance signs it off, before its next flight.
    value: true
    source: assumption
    citation: "Maintenance-manual practice (FAA AC 20-136 covers lightning protection). Not read in full, so kept as an assumption."
    enforced: true
    checked_by: lightning_strike_inspection

  # ------------------------------------------------------------------ GROUND STAFF (no federal hour limit; these are our assumptions)
  - id: ground_staff_max_shift_min
    path: ground_staff.max_shift_min
    description: Longest shift for gate, ramp, wheelchair and customer service staff, including any overtime.
    value: 720
    source: assumption
    citation: "No federal hour limit for ground staff. Class-project choice (12 h)."
    enforced: true
    checked_by: ground_staff_limits

  - id: ground_staff_break_interval_min
    path: ground_staff.break_interval_min
    description: Longest time a person works without a break.
    value: 300
    source: assumption
    citation: "No federal rule; class-project choice (5 h)"
    enforced: true
    checked_by: ground_staff_limits

  - id: ground_staff_break_length_min
    path: ground_staff.break_length_min
    description: How long a break lasts.
    value: 30
    source: assumption
    citation: "No federal rule; class-project choice"
    enforced: true
    checked_by: ground_staff_limits

  - id: ground_staff_min_gap_min
    path: ground_staff.min_gap_between_shifts_min
    description: Shortest time off between the end of one shift and the start of the next.
    value: 600
    source: assumption
    citation: "No federal rule; class-project choice (10 h)"
    enforced: true
    checked_by: ground_staff_limits

  - id: ground_staff_max_consecutive_days
    path: ground_staff.max_consecutive_days
    description: Most days in a row a person may work.
    value: 6
    source: assumption
    citation: "No federal rule; class-project choice"
    enforced: true
    checked_by: ground_staff_limits

  # ------------------------------------------------------------------ AIRPORT STATIONS
  - id: tsa_rescreen_outside_secure_area
    path: airports.tsa_rescreen_if_deplaned_outside_secure
    description: >-
      Passengers who get off outside the secure area (stairs onto the ramp, a station with no secure connection) must go through
      TSA screening again before they can get back on a plane. If the checkpoint is closed they cannot continue until it opens.
    value: true
    source: assumption
    citation: "TSA practice; no single rule read. Class-project choice."
    enforced: true
    checked_by: tsa_rescreening

  - id: tsa_checkpoint_hours
    path: airports.tsa_checkpoint_hours
    description: When the TSA checkpoint is open at the stations a flight can divert to (local time).
    value:
      STL: {open: "04:00", close: "22:30"}
      OMA: {open: "04:00", close: "21:30"}
      DSM: {open: "04:00", close: "21:00"}
      ICT: {open: "04:00", close: "20:30"}
      TUL: {open: "04:00", close: "21:30"}
      DEN: {open: "00:00", close: "24:00"}
      DAL: {open: "04:00", close: "23:00"}
      MDW: {open: "04:00", close: "23:00"}
      BWI: {open: "04:00", close: "23:00"}
      MCI: {open: "04:00", close: "23:00"}
    source: assumption
    citation: "Invented for the class project. Real hours differ and change by day."
    enforced: true
    checked_by: tsa_rescreening

  - id: southwest_station_hours
    path: airports.southwest_staffed_hours
    description: When Southwest has its own people (gate agents, ramp, wheelchair help) at a station, local time. Outside these hours a diverted plane can land but nobody is there to help.
    value:
      STL: {open: "04:30", close: "23:30"}
      OMA: {open: "04:30", close: "22:30"}
      DSM: {open: "04:30", close: "22:00"}
      ICT: {open: "04:30", close: "21:30"}
      TUL: {open: "04:30", close: "22:30"}
      DEN: {open: "00:00", close: "24:00"}
      DAL: {open: "00:00", close: "24:00"}
      MDW: {open: "00:00", close: "24:00"}
      BWI: {open: "00:00", close: "24:00"}
      MCI: {open: "00:00", close: "24:00"}
    source: assumption
    citation: "Invented for the class project"
    enforced: true
    checked_by: station_staffed

  # ------------------------------------------------------------------ CHILDREN ALONE: when stranded
  - id: child_alone_stranded_supervised
    path: child_alone.stranded_supervised
    description: >-
      A child flying alone who is stranded stays with Southwest staff until handed to the named adult. Never sent to a hotel alone,
      and no rebooking plan without a named adult or staff supervision.
    value: true
    source: assumption
    citation: "Southwest has not been confirmed to publish this; common unaccompanied-minor practice. Class-project choice."
    enforced: true
    checked_by: child_alone_has_plan

  # ------------------------------------------------------------------ THE ORCHESTRATOR'S RULE CHECK (backend/rules/check.py)
  - id: missing_or_stale_data_blocks
    path: rule_check.missing_or_stale_data_blocks
    description: A proposal whose facts are missing, unknown, or older than its agent's allowed data age is blocked, never passed.
    value: true
    source: assumption
    citation: "Class-project choice (shared AI guardrail)"
    enforced: true
    checked_by: check

  - id: proposal_conflicts_block
    path: rule_check.conflicts_block
    description: Two pending proposals that can't both happen (delay and cancel the same flight; rebook onto a flight another proposal cancels, or that is full) are blocked and sent to a human.
    value: true
    source: assumption
    citation: "Class-project choice"
    enforced: true
    checked_by: check

  - id: message_matches_truth
    path: rule_check.message_matches_truth
    description: A message to passengers must match the truth and every approved decision.
    value: true
    source: assumption
    citation: "Class-project choice"
    enforced: true
    checked_by: check

  - id: offer_needs_approved_decision
    path: rule_check.offer_needs_approved_decision
    description: Nobody is promised a hotel, money, a rebooking or a time unless an approved decision backs it.
    value: true
    source: assumption
    citation: "Class-project choice (shared AI guardrail)"
    enforced: true
    checked_by: check

  - id: no_double_assignment
    path: rule_check.no_double_assignment
    description: The same crew or the same aircraft can't be put on two flights by two proposals.
    value: true
    source: assumption
    citation: "Class-project choice"
    enforced: true
    checked_by: check

  - id: override_only_by_named_human
    path: rule_check.override_only_by_named_human
    description: >-
      A block can be lifted only by a named person in the role a law rule names (override_by), only for the exception that law allows,
      and the person's role and reason are written to the audit log. The orchestrator can never override.
    value: true
    source: assumption
    citation: "Class-project choice; the exceptions themselves come from 14 CFR 259.4(c)(3) and (c)(4)"
    enforced: true
    checked_by: human_override

  - id: crew_availability
    path: limits_crew.availability_usable
    description: Only crews marked on_duty or reserve can be assigned. Sick, fatigued or on-leave crews are never assigned; agents only read this, they never plan leave.
    value: [on_duty, reserve]
    source: assumption
    citation: "Class-project choice; a fatigue report also stops a pilot by law (14 CFR 117.5)"
    enforced: true
    checked_by: crew_available

  # ------------------------------------------------------------------ ADDED FOR THE DECISION CATALOG (assumptions, not yet enforced)
  - id: incident_cost_cap_usd
    path: money.incident_cost_cap_usd
    description: When the running cost of an incident passes these amounts, the orchestrator escalates to the named role.
    value: {station_manager: 25000, director_of_operations: 100000}
    source: assumption
    citation: "Class-project choice"
    enforced: false

  - id: human_answer_deadline_min
    path: rule_check.human_answer_deadline_min
    description: If the named human doesn't answer within this many minutes (or before the decision's own deadline, if sooner), the orchestrator escalates to the next role.
    value: 10
    source: assumption
    citation: "Class-project choice"
    enforced: false

  - id: seat_priority_order
    path: rebooking.seat_priority_order
    description: Who gets scarce seats first. Children flying alone, then medical and wheelchair passengers, then the last connection of the day, then families, then everyone else in booking order.
    value: [child_alone, medical_or_wheelchair, last_connection_of_day, families, booking_order]
    source: assumption
    citation: "Class-project choice"
    enforced: false

  - id: loyalty_priority_fairness
    path: rebooking.loyalty_only_breaks_ties
    description: Loyalty status may only break a tie between otherwise equal passengers; it never puts anyone ahead of a vulnerable passenger.
    value: true
    source: assumption
    citation: "Class-project choice (fairness check)"
    enforced: false

  - id: keep_families_together
    path: rebooking.keep_families_together
    description: People on the same booking are rebooked together unless they ask otherwise.
    value: true
    source: assumption
    citation: "Class-project choice"
    enforced: false

  - id: status_update_interval_min
    path: messages.status_update_interval_min
    description: After the first notice, passengers (on board and in the terminal) get an update at least this often while the stop lasts.
    value: 30
    source: assumption
    citation: "Class-project choice; the law only requires the first one at 30 minutes on the tarmac (14 CFR 259.4(c)(6))"
    enforced: false

  - id: terminal_crowding_alert_share
    path: airports.terminal_crowding_alert_share
    description: Ask the airport for more space when the terminal is this full.
    value: 0.85
    source: assumption
    citation: "Class-project choice"
    enforced: false

  - id: send_locals_home
    path: hotels.send_locals_home
    description: Passengers who live in the Kansas City area are offered transport home instead of a hotel.
    value: true
    source: assumption
    citation: "Class-project choice"
    enforced: false

  - id: terminal_care_after_min
    path: terminal.care_after_min
    description: After this long waiting in the terminal, offer water, snacks, baby supplies, relief areas for service animals and quiet seating for medical needs.
    value: 120
    source: assumption
    citation: "Class-project choice"
    enforced: false

  - id: poc_battery_check
    path: terminal.poc_battery_check
    description: Passengers using a portable oxygen concentrator are asked about battery time when a delay passes 1 hour, and offered power.
    value: {after_min: 60}
    source: assumption
    citation: "Class-project choice; the oxygen concentrator rules are in 14 CFR 382.133 (not read)"
    enforced: false

  - id: travel_waiver_after_min
    path: money.travel_waiver_after_min
    description: When a stop is expected to last this long, offer a free same-day change for flights in the next 24 hours.
    value: 120
    source: assumption
    citation: "Class-project choice; Southwest's actual waiver practice was not checked"
    enforced: false

  # ------------------------------------------------------------------ RECOVERY
  - id: operations_back_quiet_min
    path: recovery.operations_back_quiet_min
    description: >-
      Operations count as back after an incident only when no flight has been newly delayed or cancelled for this many minutes
      (as well as: no FAA program, ramp open, nothing holding, every feed and system healthy). The one definition is
      backend/rules/recovery.py; the Situation agent and the chaos judge both use it.
    value: 30
    source: assumption
    citation: "Class-project choice"
    enforced: false
