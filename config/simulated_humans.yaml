# Stand-ins for the PEOPLE who answer the co-pilot, used only in the simulation (co-pilot mode). Today mode has no co-pilot, so
# nobody is asked anything there. Every answer is an event with actor "simulated_human:<role>", never "agent".
# A simulated person may look at the simulator's truth (they can look out of the window); agents still can't.
# All numbers are assumptions.

response_min:                          # how long a person takes to answer, drawn uniformly in [low, high] minutes
  customer_service_supervisor:
    normal: [5, 20]                    # assumption
    urgent: [2, 8]                     # assumption
  network_operations_control:
    normal: [5, 20]                    # assumption
    urgent: [2, 8]                     # assumption

handles:                               # what each simulated person answers. Anything else stays pending (it is listed, not answered)
  customer_service_supervisor: [draft_message, send_mass_message, send_staff_briefing, escalate_channel_problem]
  network_operations_control: [resolve_source_conflict]
# Deliberately NOT handled: classify_cause / A03 ("was it within Southwest's control?") and other Situation proposals. Those decide
# what passengers are owed; a simulation should not invent that answer.
