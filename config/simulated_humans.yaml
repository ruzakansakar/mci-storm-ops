# Stand-ins for the PEOPLE who answer the co-pilot, used only in the simulation (co-pilot mode). Today mode has no co-pilot, so
# nobody is asked anything there. Every answer is an event with actor "simulated_human:<role>", never "agent".
# A simulated person may look at the simulator's truth (they can look out of the window); agents still can't.
# All numbers are assumptions.

response_min:                          # how long a person takes to answer, drawn uniformly in [low, high] minutes
  crew_scheduling:
    normal: [5, 20]                    # assumption
    urgent: [2, 8]                     # assumption
  customer_service_supervisor:
    normal: [5, 20]                    # assumption
    urgent: [2, 8]                     # assumption
  network_operations_control:
    normal: [5, 20]                    # assumption
    urgent: [2, 8]                     # assumption
  station_manager:                     # Phase 4f
    normal: [5, 20]                    # assumption
    urgent: [2, 8]                     # assumption
  ramp_supervisor:                     # Phase 4f
    normal: [5, 20]                    # assumption
    urgent: [2, 8]                     # assumption
  director_of_operations:              # Phase 5b: the duty manager, answering escalations
    normal: [3, 10]                    # assumption
    urgent: [2, 5]                     # assumption

duty_manager: director_of_operations   # Phase 5b: answers anything a simulated role answers, once it is escalated to them

handles:                               # what each simulated person answers. Anything else stays pending (it is listed, not answered)
  customer_service_supervisor: [draft_message, send_mass_message, send_staff_briefing, send_crew_message, escalate_channel_problem,
                                issue_compensation, arrange_ground_transport, offer_refund,   # 4e: rooms, transport, refund offers
                                rebook_passenger]              # 5b: asked only in orchestrated mode (advice elsewhere)
  network_operations_control: [resolve_source_conflict, delay_flight, cancel_flight, declare_recovery]   # 5a: A10
  crew_scheduling: [call_in_reserve_crew, swap_crews, deadhead_crew]
  station_manager: [assign_gates, move_gate_agents, call_in_ground_staff, supervise_child_alone, arrange_food_water,
                    start_deplaning, arrange_diversion_deplaning, request_airport_resources,          # 4f: Station & Staff
                    close_incident, set_incident_priority]                                            # 5a: Q07, T05
  ramp_supervisor: [flag_ramp_service_impact]   # 4f: only if a pause ever needs approval (it is automatic in the rules)
# Deliberately NOT handled: the human-only decisions (ramp closure E01, reopening E02, stopping work E12: ramp supervisor; returning
# to a gate F06 and the keep-on-board exception F07: the captain): they are only ever asked, with the facts. rebook_passenger
# (Passenger Care's rebooking advice is advisory), classify_cause / A03 ("was it within Southwest's control?") and other Situation proposals. Those decide
# what passengers are owed; a simulation should not invent that answer.
