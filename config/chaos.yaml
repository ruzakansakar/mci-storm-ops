# Chaos testing: random worst-case days for the Situation agent. Every number is an assumption.
# The agent never reads this file (AgentContext and a test make sure of it).

day: {start: "05:00", end: "23:59"}

ingredients_per_day: {1: 35, 2: 45, 3: 20}        # assumption: weights for how many ingredients a day has

# Ingredient weights (relative). "primary" ones use an FAA program; at most one per day.
ingredients:
  quiet: 7                      # assumption: nothing happens (the false-alarm test); always alone
  normal_variation: 8           # assumption: a few scattered delays that are not an incident
  thunderstorm: 26              # assumption (primary)
  ground_delay_program: 8       # assumption (primary)
  it_outage: 8                  # assumption (primary, or second incident without an FAA program)
  power_outage: 7               # assumption (primary, or second incident)
  runway_closure: 6             # assumption (primary)
  security: 6                   # assumption (primary, or second incident)
  crew_wave: 7                  # assumption
  feed_outage: 10               # assumption
  conflict: 10                  # assumption
  messy_data: 15                # assumption
  timing_extreme: 5             # assumption

combos:
  storm_plus_messy: 0.15        # assumption: share of days forced to be "thunderstorm + messy data"
  two_incidents: 0.20           # assumption: share of days forced to have two overlapping incidents

primary: [thunderstorm, ground_delay_program, it_outage, power_outage, runway_closure, security]
second_incident: [it_outage, power_outage, security, crew_wave]

thunderstorm:
  start_window: ["05:30", "22:00"]          # assumption
  first_length_min: [30, 180]               # assumption: length first announced
  extensions_weights: {0: 40, 1: 25, 2: 15, 3: 12, 4: 8}   # assumption
  extension_min: [15, 60]                   # assumption
  max_length_min: 300                       # assumption: 5 h
  shorten_chance: 0.08                      # assumption: the FAA brings the end forward once
  shorten_min: [10, 30]                     # assumption
  end_early_chance: 0.10                    # assumption: it ends before the announced end
  end_early_min: [10, 40]                   # assumption
  ramp_closure_chance: 0.7                  # assumption
  ramp_closure_min: [15, 60]                # assumption
ground_delay_program: {start_window: ["06:00", "20:00"], length_min: [60, 240]}       # assumption
it_outage: {start_window: ["06:00", "19:00"], length_min: [45, 180], second_length_min: [20, 90]}   # assumption
power_outage: {start_window: ["06:00", "21:00"], length_min: [20, 120]}               # assumption
runway_closure: {start_window: ["06:00", "21:00"], length_min: [30, 180]}             # assumption
security: {start_window: ["07:00", "21:00"], length_min: [30, 120]}                   # assumption
crew_wave:
  start_window: ["07:00", "20:00"]          # assumption
  window_min: [60, 120]                     # assumption
  crews: [6, 9]                             # assumption: crews whose duty clock drops
  minutes_left: [5, 30]                     # assumption
  incident_if_cancellations: 2              # assumption: it is an incident if at least this many flights cancel
feed_outage: {feeds: [faa_feed, weather_feed, flight_ops, station_ops], length_min: [5, 60]}   # assumption
normal_variation: {delays: [2, 4], delay_min: [20, 45], spacing_min: 45}             # assumption
messy_data:
  duplicates: [3, 8]                        # assumption
  late: [2, 5]                              # assumption
  late_by_min: [10, 40]                     # assumption
  malformed: [1, 3]                         # assumption
  unknown: [1, 2]                           # assumption
  unknown_types: [volcanic_ash_advisory, bird_strike_cluster]
conflict:
  kinds: [false_end, health_up_feed_down, departed_while_ramp_closed]
  false_end_before_min: [25, 45]            # assumption
  feed_down_min: [10, 30]                   # assumption
timing_extreme: {late_start: "21:30", late_length_min: [200, 300]}                     # assumption

systems:
  flight_ops: "Amadeus Altea (simulated)"
