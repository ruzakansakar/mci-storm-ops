# Settings for the Communication agent (backend/agents/communication/). Every number is a class-project assumption.
# The agent reads only this file and the database (through AgentContext). Never the simulator's code or config: it does not know
# how late each channel is meant to be or how often it fails. It learns the usual lag of each channel from what it observes.

station: MCI
fix:
  settle_min: 2                       # assumption: allow noncritical trip changes to settle
  window_min: 30                      # assumption: rolling per-passenger/channel push window
  max_pushes: 3                       # assumption: includes resends and merged corrections
  retry_min: 15                       # assumption: do not repeat a version while delivery is expected: wait at least this,
                                      # and at least the channel's usual lag as measured today, unless a failure receipt came
  resend_after_min: 30                # assumption: stuck-channel alternative delivery threshold
  unknown_departure_days: 2           # assumption: unknown departures sort after today's known flights
  alternate_order: [app, sms]         # assumption: only supported passenger-owned channel types
messages:                             # Phase 4b-3: passenger messages and staff notes (templates: config/message_templates.yaml)
  channel_order: [app, sms]           # assumption: one message per change, in the app if they have it, else by SMS (O02);
                                      # a failed delivery is resent once on the other one
  settle_min: 2                       # assumption: wait this long after a trip change so several changes become one message
  interval_min: 60                    # assumption: while a passenger's flight is waiting on the incident, a "no change yet"
                                      # update this often (real changes are still sent at once, after settle_min)
  max_per_hour: 4                     # assumption: anti-spam: at most this many messages per passenger in any rolling 60 min
  mass_message_passengers: 50         # assumption: one message to more passengers than this needs one approval for the batch
  mass_promise_margin_min: 20         # assumption: a batch needs an approval first; promise the next update this much later
  sms_max_chars: 320                  # assumption: two SMS segments
  readability_min: 55                 # assumption: Flesch reading ease (60+ is plain English; flight numbers make it a bit lower)
  cause_confidence_min: 0.7           # assumption: say "weather" only if Situation is at least this sure; else "an operational issue"
  end_confidence_low: 0.5             # assumption: below this, "we don't have a reliable estimate yet"
  affected_window_min: 120            # assumption: a flight is affected if it leaves before Situation's latest expected end + this
  correction_after_min: 20            # assumption: an app/SMS screen wrong this long told the passenger something wrong: correct it
  staff_note_gap_min: 15              # assumption: at most one staff note this often (and only when the picture changed)
  approval_withdraw_on_change: true   # a message waiting for approval is withdrawn and redrafted if the trip changes meanwhile
conflicts:                            # Phase 4b-3: holds for a Situation conflict are narrow, short and escalated
  hold_fields:                        # which trip details a conflict on a flight holds (conflict field -> trip fields)
    status: [status]                  # "departed vs at the gate" holds only the trip's status; itinerary and bags keep being fixed
    expected_end: []
    system_status: []
  ask_after_min: 15                   # assumption: after this long holding, ask network operations which side is true (A09)
  urgent_after_min: 45                # assumption: after this long, ask again as urgent
situation:                            # reading the Situation agent's shared picture (Phase 4c)
  unavailable_after_min: 12           # assumption: Situation runs at least every 5 min; no heartbeat for this long = it stopped
  escalate_after_min: 30              # assumption: tell the customer service supervisor if it stays unavailable longer than this
  disagree_after_min: 10              # assumption: both agents judge feed freshness on their own clocks; a disagreement must last
                                      # this long before it is logged and escalated (short timing differences are not one)
channels: [app, sms, gate_screen, call_center]
fields: [itinerary, status, destination, bag_routing]

run:
  every_min: 1                         # assumption: scan every simulated minute (every event is on the minute, so this also
                                       # catches every truth change and delivery receipt the minute it arrives)
  day_start: "05:00"                   # assumption: replay window
  day_end: "23:59"                     # assumption
  watchdog_after_sec: 180              # assumption: wake this long after a feed goes quiet (as the Situation agent does)

data:
  truth_feed: reservations             # the trip records: if this is stale, nothing is checked
  # assumption: at the start of the day every channel shows the start-of-day trip record (the overnight sync), so before any
  # change nothing is wrong. A channel is then rebuilt from its own updates.

cause:
  # "waiting for a normal update" while younger than the channel's usual lag; "stuck" after it. The usual lag is MEASURED by the
  # agent: how long each channel took to catch up on the mismatches it saw clear today.
  usual_lag_percentile: 0.9            # assumption: "usual" = this share of the catch-ups it has seen were at least this fast
  min_lag_observations: 10             # assumption: until it has seen this many catch-ups on a channel, it uses the default
  default_usual_lag_min: 15            # assumption: before it has its own measurements
  confidence:                          # assumption: how sure each kind of evidence makes it
    failed_delivery: 0.9               # a delivery receipt says the update did not arrive
    bag_system: 0.8                    # only the bag routing differs
    seat_hold: 0.6                     # the change it is waiting for is a rebooking (new flight ids)
    waiting_for_update: 0.7
    stuck: 0.6
    unknown: 0.3                       # the channel shows something the truth never said today

severity:                              # from the passenger's point of view
  vulnerable_segments: [child_alone, wheelchair]
  vulnerable_within_min: 120           # assumption: critical for these passengers if the flight leaves within 2 h
  near_departure_min: 180              # assumption: high if a wrong flight or status and the flight leaves within 3 h
  old_after_min: 30                    # assumption: high if wrong for longer than this
  far_future_min: 720                  # assumption: low if the flight leaves more than 12 h from now (e.g. tomorrow)
  boost_within_min: 60                 # assumption: one level up ("about to matter") if the flight leaves within 1 h

escalate:                              # the contract's escalate_when (a recommendation to the customer service supervisor)
  flight_passengers_wrong: 5           # assumption: more than this many tracked passengers wrong about the same flight
  vulnerable_wrong_min: 10             # assumption: a vulnerable passenger shown a cancelled or wrong flight for longer than this
  failures_per_window: 3               # assumption: more than this many failed deliveries on one channel...
  failures_window_min: 30              # ...within this many minutes

summary_every_min: 15                  # assumption: a communication_summary event at most this often (and when a critical one opens)


ai:
  enabled: false                       # no AI in 4b-1
